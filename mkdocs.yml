site_name: C# Mastery Path
site_description: A structured, module-wise C#/.NET training program from entry level to master level.
site_url: https://sigilipelli.github.io/csharp-mastery-path/
repo_url: https://github.com/SIGILIPELLI/csharp-mastery-path
repo_name: csharp-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is C# & .NET?": level-1/01-what-is-csharp-dotnet.md
      - "02 · Variables & Types": level-1/02-variables-types.md
      - "03 · Control Flow": level-1/03-control-flow.md
      - "04 · Methods & Functions": level-1/04-methods-functions.md
      - "05 · Classes & Objects": level-1/05-classes-objects.md
      - "06 · Collections": level-1/06-collections.md
      - "07 · Exception Handling": level-1/07-exception-handling.md
      - "08 · LINQ Basics": level-1/08-linq-basics.md
      - "09 · File I/O & Working with Text": level-1/09-file-io.md
      - "10 · Project — Console Task Manager App": level-1/10-project-task-manager.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Interfaces & Polymorphism": level-2/01-interfaces-polymorphism.md
      - "02 · Generics": level-2/02-generics.md
      - "03 · Delegates & Events": level-2/03-delegates-events.md
      - "04 · Async/Await Basics": level-2/04-async-await-basics.md
